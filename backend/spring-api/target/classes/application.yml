server:
  port: ${PORT:8080}
  address: 0.0.0.0

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

  order:
    shipping-cost: ${ORDER_SHIPPING_COST:0}
    free-shipping-threshold: ${ORDER_FREE_SHIPPING_THRESHOLD:0}
    tax-rate: ${ORDER_TAX_RATE:0}

  base-url: ${BASE_URL:http://localhost:8080}

  jwt:
    secret: ${JWT_SECRET:khalid-bijoux-secret-key-change-in-production-2024-very-secure-key-2026}
    expiration-ms: ${JWT_EXPIRATION_MS:28800000}

  admin:
    email: ${ADMIN_EMAIL:admin@khalid-bijoux.com}
    bootstrap:
      enabled: ${ADMIN_BOOTSTRAP_ENABLED:true}
      email: ${ADMIN_BOOTSTRAP_EMAIL:admin@khalid-bijoux.com}
      password: ${ADMIN_BOOTSTRAP_PASSWORD:admin123}

  upload:
    directory: ${UPLOAD_DIRECTORY:uploads/products}

  auth:
    cookie-secure: ${AUTH_COOKIE_SECURE:false}


cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:...}
  api-key: ${CLOUDINARY_API_KEY:...}
  api-secret: ${CLOUDINARY_API_SECRET:...}


# ==========================================
# BREVO
# ==========================================
brevo:
  api-key: ${BREVO_API_KEY}
  from-email: ${MAIL_FROM_EMAIL}
  from-name: ${MAIL_FROM_NAME:Khalid Bijoux}


spring:
  datasource:
    url: jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:khalidbijoux_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQLUSER:root}
    password: ${MYSQLPASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # SMTP conservé pour le développement local avec SMTP4Dev
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:25}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect